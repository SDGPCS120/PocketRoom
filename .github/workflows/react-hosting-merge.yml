name: Deploy React web to Firebase Hosting on merge

on:
  push:
    branches:
      - Dev
    paths:
      - "frontend/web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/react-hosting-merge.yml"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm ci && npm run build
        working-directory: frontend/web
        env:
          VITE_API_URL: https://pocketroom-backend-93470454666.asia-south1.run.app

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETROOM_80F62 }}
          channelId: live
          projectId: pocketroom-80f62
          target: seller
