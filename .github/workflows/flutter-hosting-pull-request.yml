name: Deploy Flutter web preview to Firebase Hosting on PR

on:
  pull_request:
    paths:
      - "frontend/mobile/**"
      - ".github/workflows/flutter-hosting-pull-request.yml"

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend/mobile

      - name: Build Flutter web
        run: flutter build web --dart-define=API_BASE_URL=https://pocketroom-backend-93470454666.asia-south1.run.app
        working-directory: frontend/mobile

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETROOM_80F62 }}
          projectId: pocketroom-80f62
          entryPoint: frontend/mobile
