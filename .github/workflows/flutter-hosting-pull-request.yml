name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - "frontend/web/**"
      - ".github/workflows/flutter-hosting-pull-request.yml"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
      - name: Build flutter web
        run: flutter pub get && flutter build web --dart-define=API_BASE_URL=https://pocketroom-backend-93470454666.asia-south1.run.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETROOM_80F62 }}
          projectId: pocketroom-80f62
