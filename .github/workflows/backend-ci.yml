name: Backend CI

on:
  push:
    branches: [Dev]
    paths:
      - 'backend/**'
  pull_request:
    branches: [Dev]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      PORT: 3000
      NODE_ENV: test
      FIREBASE_SERVICE_ACCOUNT_PATH: ./service-account.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Write service account file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
