name: Frontend Web CI

on:
  push:
    branches: [Dev]
    paths:
      - 'frontend/web/**'
  pull_request:
    branches: [Dev]
    paths:
      - 'frontend/web/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://pocketroom-backend-93470454666.asia-south1.run.app
