name: pocketroom
description: "pocketroom stuff"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2
  http: ^1.2.2
  flutter_unity_widget_2: ^6000.0.0
  flutter_riverpod: ^2.4.9
  getwidget: ^4.0.0
  google_fonts: ^6.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0
  mockito: ^5.6.3
  build_runner: ^2.13.0
  firebase_auth_mocks: 0.14.2
  fake_cloud_firestore: 3.0.0

dependency_overrides:
  flutter_unity_widget_2:
    path: plugins/flutter_unity_widget_2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo.svg
    - assets/get_started_hero.png
    - assets/bannerSofa.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
